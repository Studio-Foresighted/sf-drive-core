<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOCITY X</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #garage-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            display: none; /* Hidden until loaded */
        }
        .car-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            background: #333;
            border: 1px solid #555;
            color: white;
            cursor: pointer;
            text-align: left;
        }
        .car-btn:hover { background: #444; }
        .car-btn.active { background: #007bff; border-color: #0056b3; }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .loading-content {
            text-align: center;
            width: 300px;
        }
        .loading-content h1 {
            margin-bottom: 20px;
            font-style: italic;
            letter-spacing: 2px;
            color: #ff3333;
        }
        .progress-container {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: #ff3333;
            transition: width 0.1s ease;
        }
        #loading-text {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-content">
            <h1>VELOCITY X</h1>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="loading-text">Loading Assets...</div>
        </div>
    </div>
    
    <div id="garage-ui">
        <h3>Select Car</h3>
        <div id="car-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
            }
        }
    </script>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
